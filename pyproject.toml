[project]
name = "viewurdf"
version = "0.1.2"
description = "A dead simple URDF viewer that just works."
authors = [
  {name = "Adam Heins", email = "mail@adamheins.com"}
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "robot-descriptions>=3.1.0",
    "scipy>=1.17.1",
    "viser>=1.0.30",
    "xacrodoc>=2.0.1",
    "yourdfpy>=0.0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
viewurdf = "viewurdf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/viewurdf"]
